[project]
dependencies = [
  "datasets>=4.4.1",
  "fastapi>=0.121.2",
  "files-to-prompt>=0.6",
  "psutil>=7.1.3",
  "pyarrow>=22.0.0",
  "regex>=2025.10.23",
  "rustbpe>=0.1.0",
  "tiktoken>=0.12.0",
  "tokenizers>=0.22.1",
  "torch>=2.9.0",
  "typer>=0.20.0",
  "uvicorn>=0.38.0",
  "wandb>=0.23.0",
]
description = "the minimal full-stack ChatGPT clone"
name = "nanochat"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.1"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = 'sm61' }, # for sm61 support
  { index = "pytorch-cu128", extra = 'gpu' },
]

[dependency-groups]
dev = ["ipython>=9.7.0", "pytest>=9.0.1"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
explicit = true
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[[tool.uv.index]]
explicit = true
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[project.optional-dependencies]
cpu = ["torch>=2.9.0"]
gpu = ["torch>=2.9.0"]
sm61 = ["torch>=2.9.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }, { extra = "sm61" }]]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"**/scripts/*.py" = ["E501"] # Ignore line length for scripts

[tool.pyright]
reportConstantRedefinition = false
